name: forced_wakeup_app
description: "モーニングルーティン\n強制アラーム - 筋トレしないと止まらないアラームアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.12.0
  just_audio: ^0.9.40
  volume_controller: ^2.0.7
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  wakelock_plus: ^1.2.8
  in_app_purchase: ^3.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  share_plus: ^9.0.0
  google_mlkit_image_labeling: ^0.12.1
  google_mlkit_object_detection: ^0.13.0
  table_calendar: ^3.1.2
  file_picker: ^8.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
