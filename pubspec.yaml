name: forced_wakeup_app
description: "朝型強制変換アラーム - 筋トレしないと止まらないアラームアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.12.0
  just_audio: ^0.9.40
  volume_controller: ^2.0.7
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
